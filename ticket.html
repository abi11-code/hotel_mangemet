        <label for="Email">Your Email</label>

        <label for="games">Choose Games</label>

            <option value="PlayStation">Play Station</option>
            <option value="PC">PC Games</option>
            <option value="Laser">Laser shooting</option>
            <option value="Bowling">Bowling</option>
            <option value="Tennis">Table Tennis</option>
            <option value="Board">Board Games</option>
        </select>
        <label for="Quantity">Ticket Quantity</label>
        <input type="number" name="Gamezone" id="Quantity">
        <label for="date">Purchase Date</label>
        <input type="date" name="Gamezone" id="date"> <input type="time">
        <button type="submit">Buy Ticket</button>
     </form>
